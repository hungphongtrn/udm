# SCRM, Qwen3.5-4B (text decoder only) + LoRA r=64, single 24 GB GPU (bf16 base, grad checkpointing, no LM head).
# Expected peak ~16-20 GB with an 8k-token prompt per micro-batch (not measured). If you still OOM: model.quantize_4bit=true
# (QLoRA) or data.render.max_len=4096.
seed: 1234
output_dir: outputs/scrm_qwen3_5_4b_24gb
model:
  name_or_path: Qwen/Qwen3.5-4B
  dtype: bfloat16
  attn_implementation: auto      # flash_attention_2 if installed, else sdpa
  gradient_checkpointing: true
  prefix_cache: true             # encode the shared prompt once per set, reuse its states for each graded option
  liger_kernel: true             # Liger RMSNorm + SwiGLU (HF integration, CUDA only)
  quantize_4bit: false           # set true for QLoRA (24 GB safety margin)
  lora: {enabled: true, r: 64, alpha: 16, dropout: 0.05, use_rslora: true, target_modules: all-linear}  # scale 16/sqrt(64)=2
  d_set: 768
  set_layers: 2
loss: {tau: 1.0, margin_alpha: 0.0, w_bt: 1.0}
data:
  repo: hungphongtrn/udm-massive-typed
  local_dir: null                # e.g. data_cache/udm  (scripts/train/prefetch_data.sh)
  streaming: false
  # Mixing: first matching group wins; weight = sampling share, max_rows = cap (sampled once per run).
  # Groups with no rows (e.g. a source not pushed yet) are skipped. Exhausted groups restart with a new shuffle.
  groups:
    - {name: massive,    match: {source_id: [AmazonScience/massive]},                     max_rows: 150000,  weight: 0.15}  # 60 cands/row
    - {name: typed,      match: {source_id: [LocalLLaMA/typed-decisions]},                                    weight: 0.10}
    - {name: tasksource, match: {source_id: [tasksource/tasksource-jev-typed-decisions]},                     weight: 0.25}
    - {name: openjev,    match: {source_id: [ZefanCai/Open-Jev]},                                             weight: 0.20}
    - {name: samatv,     match: {source_id: [samatv256/jev-decisions-v1]},                max_rows: 1000000, weight: 0.30}  # ~6M rows
  other_weight: 0.05
  eval_max_rows: 2000
  eval_max_rows_per_source: 200
  # One sequence per GRADED option: "{state}\n\n{instruction}\n\nOptions:\n...\n\nGrade this choice: Option k: ..."
  # ending at the assistant header. The shared prompt is encoded ONCE per set (model.prefix_cache) and its states
  # are reused by every graded option, so a set costs ~ prompt + max_graded x (short option suffix) tokens.
  # max_len is the per-sequence context (prompt + graded option). Eval / rank() grade every shown option.
  render: {max_len: 8192, cand_max_tokens: 256, state_max_tokens: 6144, instr_max_tokens: 512, max_candidates: 64,
           max_graded: 8}
  # token budget per micro-batch (sets sorted by length; one long set may exceed it alone)
  batch: {max_tokens_per_batch: 8192, max_batch_size: 16, bucket_size: 256}
  num_workers: 3
train:
  max_steps: 20000
  grad_accum: 8
  lr_lora: 1.0e-4
  lr_head: 5.0e-4
  warmup_steps: 300
  eval_every: 1000
  save_every: 1000
  keep_last: 3
wandb: {enabled: true, project: scrm, tags: [qwen3.5-4b, 24gb]}
