# SCRM, Qwen3.5-4B (text decoder only) + LoRA r=64, single 24 GB GPU (bf16 base, grad checkpointing, no LM head).
# max_len 4096 per sequence; sets that do not fit are dropped, never truncated (only samatv has longer states:
# ~68% of its rows are dropped, plenty remain). Run with PYTORCH_ALLOC_CONF=expandable_segments:True.
seed: 1234
output_dir: outputs/scrm_qwen3_5_4b_24gb
model:
  name_or_path: Qwen/Qwen3.5-4B
  dtype: bfloat16
  attn_implementation: auto      # flash_attention_2 if installed, else sdpa
  gradient_checkpointing: true
  liger_kernel: true             # Liger RMSNorm + SwiGLU (HF integration, CUDA only)
  quantize_4bit: false           # set true for QLoRA (24 GB safety margin)
  lora: {enabled: true, r: 64, alpha: 16, dropout: 0.05, use_rslora: true, target_modules: all-linear}  # scale 16/sqrt(64)=2
  d_set: 768
  set_layers: 2
loss: {tau: 1.0, margin_alpha: 0.0, w_bt: 1.0}
data:
  repo: hungphongtrn/udm-massive-typed
  local_dir: null                # e.g. data_cache/udm  (scripts/train/prefetch_data.sh)
  streaming: true                # the full dataset (24 GB parquet) does not fit as an Arrow cache; per-group `files` keep streaming fast
  # Mixing: first matching group wins; weight = sampling share, max_rows = cap (sampled once per run).
  # Groups with no rows (e.g. a source not pushed yet) are skipped. Exhausted groups restart with a new shuffle.
  groups:
    - {name: massive,    files: [data/train-0*.parquet], match: {source_id: [AmazonScience/massive]},                     max_rows: 150000,  weight: 0.15}  # 60 cands/row
    - {name: typed,      files: [data/train-0*.parquet], match: {source_id: [LocalLLaMA/typed-decisions]},                                    weight: 0.10}
    - {name: tasksource, files: [data/train-tasksource-*.parquet], match: {source_id: [tasksource/tasksource-jev-typed-decisions]},                     weight: 0.25}
    - {name: openjev,    files: [data/train-openjev-*.parquet], match: {source_id: [ZefanCai/Open-Jev]},                                             weight: 0.20}
    - {name: samatv,     files: [data/train-samatv*.parquet], match: {source_id: [samatv256/jev-decisions-v1]},                max_rows: 1000000, weight: 0.30}  # ~6M rows
  other_weight: 0                # every source_id is covered by a group above
  # val + test caps; eval grades every shown option (~29/set) + perm check, ~1 h per eval round on a 4090 at 1000 rows
  eval_max_rows: 1000
  eval_max_rows_per_source: 100
  # One sequence per GRADED option: "{state}\n\n{instruction}\n\nOptions:\n...\n\nGrade this choice: Option k: ..."
  # ending at the assistant header; a set costs ~ max_graded x (prompt + option) tokens.
  # max_len is the per-sequence context (prompt + graded option). Eval / rank() grade every shown option.
  render: {max_len: 4096, max_candidates: 64,
           max_graded: 8}
  # packing: whole sets are best-fit-decreasing packed into micro-batches of <= max_tokens_per_batch tokens
  # (padding-free; a set larger than that forms its own micro-batch, encoded in chunks of that size)
  batch: {max_tokens_per_batch: 4096, max_batch_size: 16, bucket_size: 256}
  num_workers: 3
train:
  max_steps: 20000
  grad_accum: 8
  lr_lora: 1.0e-4
  lr_head: 5.0e-4
  warmup_steps: 300
  eval_every: 1000
  save_every: 1000
  keep_last: 3
# test split + Decision Index sample at save steps (dindex every 2000 steps, ~40M tokens); suite + sample from
# scripts/train/dindex_setup.sh (paths relative to the repo root)
benchmarks:
  decision_index: {enabled: true, suite_dir: ../decision-index/suite-0.2, rows: ../decision-index/sample-1000.jsonl.gz,
                   every: 2000}
wandb: {enabled: true, project: scrm, tags: [qwen3.5-4b, 24gb]}
