# Smoke-test config: tiny random Qwen3 + offline tiny tokenizer, CPU friendly. Needs a local parquet dir
# (see scripts/train/smoke_test.sh, which generates synthetic contract-format data).
seed: 0
output_dir: outputs/debug_tiny
model:
  name_or_path: tiny
  dtype: float32
  gradient_checkpointing: true
  lora: {enabled: true, r: 8, alpha: 16, dropout: 0.0}
  d_set: 32
  set_heads: 4
  set_layers: 2
data:
  local_dir: outputs/synth_data
  streaming: false
  eval_max_rows: 60
  eval_max_rows_per_source: 20
  perm_eval_rows: 8
  render: {max_len: 256, cand_max_tokens: 16, state_max_tokens: 96, max_candidates: 16}
  batch: {max_tokens_per_batch: 1024, max_batch_size: 8, bucket_size: 32}
  num_workers: 0
train:
  max_steps: 12
  grad_accum: 2
  warmup_steps: 2
  log_every: 2
  eval_every: 6
  save_every: 6
  keep_last: 2
  lr_lora: 1.0e-3
  lr_head: 2.0e-3
  lr_special: 2.0e-3
wandb: {enabled: false}
