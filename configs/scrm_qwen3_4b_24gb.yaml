# SCRM, Qwen3-4B + LoRA r=64, single 24 GB GPU (bf16 base, grad checkpointing, no LM head).
# Expected peak ~14-17 GB at 4096 padded tokens / micro-batch. If you still OOM: model.quantize_4bit=true
# (QLoRA, ~9-11 GB) or data.batch.max_tokens_per_batch=2048.
seed: 1234
output_dir: outputs/scrm_qwen3_4b_24gb
model:
  name_or_path: Qwen/Qwen3-4B
  dtype: bfloat16
  attn_implementation: auto      # flash_attention_2 if installed, else sdpa
  gradient_checkpointing: true
  quantize_4bit: false           # set true for QLoRA (24 GB safety margin)
  lora: {enabled: true, r: 64, alpha: 128, dropout: 0.05}
  d_set: 768
  set_layers: 2
loss: {tau: 1.0, margin_alpha: 0.0, w_bt: 1.0}
data:
  repo: hungphongtrn/udm-massive-typed
  local_dir: null                # e.g. data_cache/udm  (scripts/train/prefetch_data.sh)
  streaming: false
  # Mixing: first matching group wins. MASSIVE has 60 candidates per row and ~870k rows -> cap it.
  groups:
    - {name: massive, match: {source_id: [AmazonScience/massive]}, max_rows: 150000, weight: 0.15}
  other_weight: 0.85
  eval_max_rows: 2000
  eval_max_rows_per_source: 200
  render: {max_len: 2048, cand_max_tokens: 128, state_max_tokens: 1536, instr_max_tokens: 256, max_candidates: 64}
  batch: {max_tokens_per_batch: 4096, max_batch_size: 16, bucket_size: 256}
  num_workers: 3
train:
  max_steps: 20000
  grad_accum: 8
  lr_lora: 1.0e-4
  lr_head: 5.0e-4
  lr_special: 5.0e-4
  warmup_steps: 300
  eval_every: 1000
  save_every: 1000
  keep_last: 3
wandb: {enabled: true, project: scrm, tags: [qwen3-4b, 24gb]}
