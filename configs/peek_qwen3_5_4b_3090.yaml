# Peek on RTX 3090 (24 GB): one full sequence per graded option (model.branching false: stock HF forward, the
# reference path) + whole-set packing + gradient caching + linear reward head.
# Same objective as configs/peek_qwen3_5_4b_h200.yaml (BT + 0.01 center, no listwise); sized for 24 GB.
# Memory: no selective checkpointing (act_tokens null: full activations cost ~8.3 MB/token, 24 GB holds ~1k), so pass 3
# keeps only per-layer boundaries (~0.17 MB/token) + one layer's recompute for the largest chunk. A chunk holds whole
# sequences of <= grad_cache_chunk_tokens tokens (a longer sequence, up to max_len, gets its own chunk).
# Watch `mem=` in the [train] line: OOM -> data.render.max_len=12288 (or 8192); lots of headroom -> raise it.
# Launch: NPROC=1 (one 3090) or NPROC=4 (four 3090s, 4x the sets per step) scripts/train/train.sh <this file> ...
base: scrm_qwen3_5_4b_24gb.yaml
output_dir: outputs/peek_qwen3_5_4b_3090
loss: {tau: 1.0, margin_alpha: 0.0, w_bt: 1.0, w_listwise: 0.0, w_plackett_luce: 0.0, w_center: 0.01}
model:
  head: linear
  gradient_checkpointing: true
  branching: false
data:
  # no branching: a set costs n_graded * len(prompt) + sum(len(option)) (every graded option is a full sequence).
  # Variety over per-set signal: grade 4 options per set (tier-0 + one per other tier kept by subsampling), so more
  # sets fit per step; in-set pairs share prompt/source and are correlated. Fixed k: the linear head needs no
  # set-size variety. Eval still grades every option (eval_max_graded null).
  render: {max_len: 16384, max_candidates: 64, max_graded: 4, min_graded: null}
  # one group = one optimizer step per rank: up to 32 whole sets (the diversity knob; memory-independent under
  # grad cache), token cap only bounds step time. Steps well under 32 sets -> raise max_tokens_per_batch, not k.
  batch: {max_tokens_per_batch: 131072, max_batch_size: 32, bucket_size: 256}
train:
  max_steps: 6000
  warmup_steps: 300
  best_metric: val_index              # `best` = highest validation index; Decision Index is test-only
  early_stop_patience: 3              # 3 evals (eval_every 1000) without improvement
  eval_every: 1000                    # validation -> best / best_step_N / early stop
  save_every: 1000                    # step_N (resumable, keep_last 3) + test split + Decision Index
  keep_best: 3                        # top-3 validation checkpoints kept as best_step_N
  grad_cache: true
  grad_cache_chunk_tokens: 8192
  grad_cache_act_tokens: null
  grad_accum: 1
benchmarks:
  decision_index: {enabled: true, suite_dir: ../decision-index/suite-0.2, rows: ../decision-index/sample-1000.jsonl.gz,
                   max_len: 16384, max_tokens: 16384, every: 1000}   # runs at save steps divisible by `every`
wandb: {enabled: true, project: scrm, tags: [qwen3.5-4b, 3090, peek]}
