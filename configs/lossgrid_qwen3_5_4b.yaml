# Experiment 2: loss-function grid on a FROZEN Qwen3.5-4B backbone, using cached per-option features.
# python -m scrm.lossgrid --config configs/lossgrid_qwen3_5_4b.yaml   (or scripts/train/lossgrid.sh <config>)
cache_dir: outputs/features_qwen3_5_4b_pack     # scrm.feature_pack: HF train + first 8 vLLM validation shards
output_dir: outputs/lossgrid/qwen3_5_4b_pack
workers: 1                                        # parallel runs (spawn); features are memory-mapped, so workers share the page cache

data:
  layer: 24                                       # feat_L24 (also 16, last -> "last")
  train_split: train
  val_split: validation
                                                  # test: full Decision Index on live features (scrm.dindex_frozen)
  augment_variants: false                         # true: train on a random presentation variant per set

model:
  head: set                                       # linear | mlp | set
  d_set: 256
  set_layers: 2
  set_heads: 4
  set_dropout: 0.1

train:
  steps: 3000                                     # identical for every arm
  eval_every: 250                                 # validation loss -> best checkpoint per run (saved head)
  batch_size: 64
  lr: 1.0e-3                                      # overridden by grid.lr
  weight_decay: 0.01
  warmup_steps: 100
  readout_lr_mult: 10.0                           # lr multiplier for the readout scalars (T, tau, alpha, bias)

loss:
  weights: {ce: 1.0, brier: 1.0, bt: 1.0, sigmoid: 1.0}   # equal weights in every multi-term arm (matched budget)
  w_center: 0.01
  w_perm: 0.0                                     # >0 needs >= 2 variants per set in the cache
  per_family_bias: false

grid:                                             # every arm gets lr x weight configs (here 2 x 1), x seeds
  terms: [ce, brier, bt, sigmoid]                 # 15 non-empty subsets
  lr: [3.0e-4, 1.0e-3]
  weight: [1.0]                                   # global multiplier on all of an arm's term weights
  seeds: [0, 1, 2]

selection:
  metric: loss/total                              # validation loss of the arm's own objective, mean over seeds
  mode: min

wandb:
  enabled: false
