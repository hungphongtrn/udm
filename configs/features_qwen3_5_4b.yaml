# Experiment 2: frozen Qwen3.5-4B feature cache for head / loss experiments (scrm.features; no LoRA, no gradients).
# Prefill-only vLLM pooling: independent prompt+option requests are packed by the engine; no token generation.
# Layers 16, 24 and last (-1): residual stream after that decoder layer, through the checkpoint final RMSNorm.
# Launch: scripts/train/extract_features.sh configs/features_qwen3_5_4b.yaml [features.max_sets.train=2000 ...]
# First Ctrl-C/SIGTERM commits the current shard and stops; repeat this command to resume. Never overwrite to resume.
# Engine scheduling caps may change on resume; inputs/render/layers/variants/seed/shard_size/max_sets may not.
# HF and vLLM caches remain separate: do not mix their shards (kernel rounding differs).
base: peek_qwen3_5_4b_3090.yaml
output_dir: outputs/features_qwen3_5_4b_vllm
model:
  gradient_checkpointing: false
  lora: {enabled: false}
data:
  # max_len: sets whose longest (prompt + option) sequence exceeds it are dropped; max_candidates caps the options per
  # set (tier-0 kept, rest subsampled deterministically; recorded as `truncated`). Every kept option is graded.
  render: {max_len: 16384, max_candidates: 64}
features:
  backend: vllm
  out_dir: outputs/features_qwen3_5_4b_vllm
  layers: [16, 24, -1]
  variants: 2                       # 0 = canonical option order, 1.. = seeded shuffles of the presented order
  seed: 0
  shard_size: 512                   # rows (sets) per shard
  splits: [train, validation, test]
  max_sets: {train: 50000, validation: null, test: null}   # rows drawn per split, sources interleaved; null = all
  vllm:
    gpu_memory_utilization: 0.9
    max_num_batched_tokens: 16384
    max_num_seqs: 32
    request_batch_size: 256        # CPU submission window; engine schedules GPU microbatches
    enable_prefix_caching: true
    enable_chunked_prefill: true   # Qwen3.5 hybrid aligned-prefix cache requires chunked prefill
wandb: {enabled: false}
