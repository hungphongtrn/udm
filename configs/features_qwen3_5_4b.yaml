# Experiment 2: frozen Qwen3.5-4B feature cache for head / loss experiments (scrm.features; no LoRA, no gradients).
# Per (set, variant): the prompt is prefilled once (HF prefix cache), every shown option ("Grade this choice: Option k")
# continues from that cache; the hidden state at its last token is stored for layers 16, 24 and the last (-1).
# Equal-length prompts batch together across a shard; matching-length suffixes batch across those prompts (no padding).
# Layer l = residual stream after the l-th decoder layer, passed through the final norm; -1 = last layer.
# Launch: scripts/train/extract_features.sh configs/features_qwen3_5_4b.yaml [features.max_sets.train=2000 ...]
# Resumable: re-running skips shards listed in <out_dir>/manifest.json. Changing layers/render/variants/seed needs a new out_dir.
# max_tokens/max_batch_size/cache_tokens change batching only and can be adjusted when resuming; bf16 kernel rounding may differ.
base: peek_qwen3_5_4b_3090.yaml
output_dir: outputs/features_qwen3_5_4b
model:
  gradient_checkpointing: false
  lora: {enabled: false}
data:
  # max_len: sets whose longest (prompt + option) sequence exceeds it are dropped; max_candidates caps the options per
  # set (tier-0 kept, rest subsampled deterministically; recorded as `truncated`). Every kept option is graded.
  render: {max_len: 16384, max_candidates: 64}
features:
  out_dir: outputs/features_qwen3_5_4b
  layers: [16, 24, -1]
  variants: 2                       # 0 = canonical option order, 1.. = seeded shuffles of the presented order
  seed: 0
  shard_size: 512                   # rows (sets) per shard
  splits: [train, validation, test]
  max_sets: {train: 50000, validation: null, test: null}   # rows drawn per split, sources interleaved; null = all
  max_tokens: 16384                 # prompt batch budget: sum(prompt + all suffix lengths), prompt counted once per set
  cache_tokens: 131072              # per suffix forward: (len(prompt) + len(suffix)) * n_suffixes (prompt KV copied per suffix)
  max_batch_size: 32                # sets per equal-length prompt batch
wandb: {enabled: false}
