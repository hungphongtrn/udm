[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "udm-scrm"
version = "0.1.0"
description = "Set-Conditioned Reward Model (SCRM): data pipeline and training code"
requires-python = ">=3.10"

[project.optional-dependencies]
data = []   # see requirements-data.txt
train = []  # see requirements-train.txt

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
