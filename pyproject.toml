[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "udm-scrm"
version = "0.1.0"
description = "Set-Conditioned Reward Model (SCRM): data pipeline and training code"
requires-python = "==3.12.*"
dependencies = [
    "pyarrow>=15",
    "numpy>=1.24",
    "pyyaml>=6",
    "huggingface_hub>=1.0",   # transfers via hf_xet (HF_XET_HIGH_PERFORMANCE); hf_transfer is no longer used
]

# Environments are uv dependency groups; scripts select them via `uv run --group ...` (see scripts/*/_env.sh).
#   data machine:  uv sync --no-default-groups --group data
#   GPU box:       uv sync                      (default: data + train + cu128)
#                  uv sync --no-default-groups --group data --group train --group cu130   (CUDA 13 drivers)
[dependency-groups]
data = [
    "pandas>=2.0",
    "duckdb>=1.0",
    "httpx>=0.25",
    "fsspec>=2023.1",
    "pytest>=7",
]
train = [
    "transformers>=5.18",        # Qwen3.5 (qwen3_5) support; tested on 5.18
    "peft>=0.14",
    "datasets>=3.0",
    "wandb",
    "safetensors",
    "accelerate>=0.30",
    "decision-index",            # Decision Index 0.2.1 scorers (scrm.dindex)
    "pytest>=7",
]
# Torch build + GPU kernels: exactly one of these. Prebuilt wheels: torch 2.10.0, causal-conv1d 1.7.0 (Gated DeltaNet
# conv); flash-linear-attention = fast Gated DeltaNet kernels (else slow torch fallback), [tilelang] = its TileLang
# backend, required on Hopper (H100/H200): torch 2.10 pins triton 3.6, whose chunk_bwd_dqkwg gives wrong grads there
# (fla issue #640; fla refuses to run). TileLang JIT-compiles with nvcc and fla silently ignores it without one:
# cu130 ships nvcc as a wheel (tilelang[nvcc]); cu128 needs a system CUDA 12.x toolkit (CUDA_HOME / PATH /
# /usr/local/cuda) — there is no CUDA 12 nvcc wheel. liger-kernel = RMSNorm/SwiGLU
# for qwen3_5 (model.liger_kernel); bitsandbytes = train.optim=adamw_8bit (default) and model.quantize_4bit.
cu128 = ["torch==2.10.0", "causal-conv1d==1.7.0", "flash-linear-attention[tilelang]", "liger-kernel>=0.8.4", "bitsandbytes>=0.43"]   # CUDA 12.8, driver >= 570 (default)
# nvcc wheels pinned to 13.0 = torch cu130's nvidia-cuda-runtime: all share nvidia/cu13/include, and cccl refuses an
# nvcc newer than the runtime headers ("CUDA compiler and CUDA toolkit headers are incompatible")
cu130 = ["torch==2.10.0", "causal-conv1d==1.7.0", "flash-linear-attention[tilelang]", "tilelang[nvcc]",
         "nvidia-cuda-nvcc==13.0.*", "nvidia-cuda-crt==13.0.*", "nvidia-nvvm==13.0.*", "nvidia-cuda-cccl==13.0.*",
         "liger-kernel>=0.8.4", "bitsandbytes>=0.43"]   # CUDA 13.0, driver >= 580
# CPU-only torch, no GPU kernels (they reject CPU tensors), for the test suite / CPU smoke runs:
#   UV_PROJECT_ENVIRONMENT=.venv-cpu uv run --locked --no-default-groups --group data --group train --group cpu pytest
cpu = ["torch==2.10.0"]

[tool.uv]
default-groups = ["data", "train", "cu128"]
conflicts = [[{ group = "cu128" }, { group = "cu130" }, { group = "cpu" }]]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu128", group = "cu128" },
    { index = "pytorch-cu130", group = "cu130" },
    { index = "pytorch-cpu", group = "cpu" },
]
causal-conv1d = [
    { url = "https://github.com/Dao-AILab/causal-conv1d/releases/download/v1.7.0/causal_conv1d-1.7.0+cu12torch2.10cxx11abiTRUE-cp312-cp312-linux_x86_64.whl", group = "cu128" },
    { url = "https://github.com/Dao-AILab/causal-conv1d/releases/download/v1.7.0/causal_conv1d-1.7.0+cu13torch2.10cxx11abiTRUE-cp312-cp312-linux_x86_64.whl", group = "cu130" },
]
decision-index = { git = "https://github.com/apolinario/decision-index", rev = "87d4650b42b377c0291a89c1f1a879f9b31082bf" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
